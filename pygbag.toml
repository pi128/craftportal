[pygbag]
# Configuration for pygbag web builds

# Exclude audio files and pygame examples that cause web build issues
exclude = [
    "*.mp3",
    "*.wav", 
    "*.ogg",
    "**/audio/**",
    "**/sounds/**",
    "**/pygame/examples/**",
    "**/examples/**",
    "**/test/**",
    "**/tests/**",
    "**/pygbag-env/**"
]

# Web-specific settings
title = "CraftPortal"
width = 1280
height = 720

# Disable audio entirely for web builds
audio = false
